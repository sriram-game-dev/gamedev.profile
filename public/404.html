<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sriram S | Game Developer · XR Specialist</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just query strings, and redirects the browser to the new url
      // with only a query string and hash fragment.
      // For GitHub Pages subfolder repositories like /gamedev.profile/
      var isSubfolder = window.location.pathname.startsWith('/gamedev.profile') ||
                        window.location.pathname.startsWith('/sriram-gamedev.github.io') ||
                        window.location.pathname.startsWith('/profile');
      var pathSegmentsToKeep = isSubfolder ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
