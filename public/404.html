<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sriram S | Game Developer · XR Specialist</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var path = l.pathname;

      // If user accesses root domain, older repo name, or missing repo prefix,
      // redirect them straight into /gamedev.profile/
      if (!path.startsWith('/gamedev.profile')) {
        var cleanSubRoute = path
          .replace(/^\/(?:sriram-gamedev\.github\.io|profile)/, '')
          .replace(/^\/+/, '');
        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/gamedev.profile/' +
          (cleanSubRoute ? '?/' + cleanSubRoute : '') +
          (l.search ? (cleanSubRoute ? '&' : '?') + l.search.slice(1) : '') +
          l.hash;
        l.replace(targetUrl);
      } else {
        // SPA redirect for GitHub Pages subfolder repository /gamedev.profile/
        var pathSegmentsToKeep = 1;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          path.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          path.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
